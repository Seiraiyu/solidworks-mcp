name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore SolidWorksMcp.slnx
      - name: Build
        run: dotnet build SolidWorksMcp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test SolidWorksMcp.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
